<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pizza Chat</title>
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <main class="chat" aria-label="Pizza chat">
    <header class="chat__header">
      <span class="chat__logo" aria-hidden="true">🍕</span>
      <div>
        <h1 class="chat__title">Pizza Chat</h1>
        <p class="chat__subtitle">English · Deutsch</p>
      </div>
      <button class="chat__restart" id="restart" type="button" title="Start a new chat">New chat</button>
    </header>

    <section class="chat__log" id="log" aria-live="polite"></section>

    <div class="chat__suggestions" id="suggestions"></div>

    <form class="chat__form" id="form" autocomplete="off">
      <input class="chat__input" id="input" name="message" maxlength="500"
             placeholder="e.g. Hawaii without pineapple / Salami ohne Zwiebeln" aria-label="Your message" required>
      <button class="chat__send" type="submit" aria-label="Send">Send</button>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
